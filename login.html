<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - PM SHRI +2 Haribag High School</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-logo">
                <img src="assets/school-logo.png" alt="PM SHRI +2 Haribag High School">
            </div>

            <h1>Admin Login</h1>

            <p class="login-subtitle">
                PM SHRI +2 Haribag High School
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">
                        Username
                    </label>

                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" id="loginButton">
                    Login
                </button>

                <p id="loginMessage" class="login-message" aria-live="polite"></p>

            </form>

        </section>

    </main>

    <script src="login.js"></script>

</body>

</html>
